    <!-- GitHub Pages SPA 回跳：把 404.html 带来的 ?/path 还原成正常路由 -->
    <script>
      ;(function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })()
    </script>
